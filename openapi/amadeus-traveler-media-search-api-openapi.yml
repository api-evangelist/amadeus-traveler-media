openapi: 3.2.0
info:
  version: 1.1.2
  title: Points of Interest Search API
  x-tags:
  - '#ama-for-dev'
  x-status: validated
  x-release-note:
    '1.1':
    - Add an id, self and rank to location resource
    - Introduce GET by id
    - add filter parameter for search operation
    1.0.2:
    - New by-square endpoint as secondary resource
    1.0.1:
    - Move from PointOfInterst to Location definition
    '1.0':
    - Initial Version
  description: 'Before using this API, we recommend you read our **Authorization Guide** for more information on how to generate an access token.


    Please also be aware that our test environment is based on a subset of the production, this API in test only returns a few selected cities. You can find the list in our **data collection**.'
servers:
- url: https://test.api.amadeus.com/v1
tags:
- name: Search
paths:
  /reference-data/locations/pois:
    get:
      tags:
      - Search
      operationId: getPointsOfInterest
      summary: Amadeus Returns Points of Interest for a Given Location and Radius
      parameters:
      - name: latitude
        description: Latitude (decimal coordinates)
        in: query
        required: true
        x-example: 41.397158
        schema:
          type: number
          format: double
      - name: longitude
        description: Longitude (decimal coordinates)
        in: query
        required: true
        x-example: 2.160873
        schema:
          type: number
          format: double
      - name: radius
        description: radius of the search in Kilometer. Can be from 0 to 20, default value is 1 Km.
        in: query
        required: false
        schema:
          type: integer
          default: 1
          maximum: 20
          minimum: 0
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/categories'
      responses:
        '200':
          $ref: '#/components/responses/points-of-interest'
        '400':
          $ref: '#/components/responses/400'
        default:
          $ref: '#/components/responses/500'
      description: ''
  /reference-data/locations/pois/by-square:
    get:
      tags:
      - Search
      operationId: getPointsOfInterestBySquare
      summary: Amadeus Returns Points of Interest for a Given Area
      parameters:
      - name: north
        description: Latitude north of bounding box (decimal coordinates)
        in: query
        required: true
        x-example: 41.397158
        schema:
          type: number
          format: double
      - name: west
        description: Longitude west of bounding box (decimal coordinates)
        in: query
        required: true
        x-example: 2.160873
        schema:
          type: number
          format: double
      - name: south
        description: Latitude south of bounding box (decimal coordinates)
        in: query
        required: true
        x-example: 41.394582
        schema:
          type: number
          format: double
      - name: east
        description: Longitude east of bounding box (decimal coordinates)
        in: query
        required: true
        x-example: 2.177181
        schema:
          type: number
          format: double
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/categories'
      responses:
        '200':
          $ref: '#/components/responses/points-of-interest'
        '400':
          $ref: '#/components/responses/400'
        default:
          $ref: '#/components/responses/500'
      description: ''
components:
