  schemas:
    Issue:
      properties:
        status:
          description: the HTTP status code applicable to this error
          type: integer
        code:
          description: an application-specific error code
          type: integer
          format: int64
        title:
          description: a short summary of the error
          type: string
        detail:
          description: explanation of the error
          type: string
        source:
          type: object
          title: Issue_Source
          description: an object containing references to the source of the error
          maxProperties: 1
          properties:
            pointer:
              description: a JSON Pointer [RFC6901] to the associated entity in the request document
              type: string
            parameter:
              description: a string indicating which URI query parameter caused the issue
              type: string
            example:
              description: a string indicating an example of the right value
              type: string
    Collection_Meta:
      title: Collection_Meta
      properties:
        count:
          type: integer
          example: 1
        links:
          title: CollectionLinks
          properties:
            self:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            next:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            previous:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            last:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            first:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
            up:
              type: string
              format: uri
              example: https://test.api.amadeus.com/v1/area/resources?...
          example:
            self: https://test.api.amadeus.com/v1/area/resources?param=value
    Error_400:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 400
          code: 477
          title: INVALID FORMAT
          detail: invalid query parameter format
          source:
            parameter: airport
            example: CDG
    Location:
      properties:
        id:
          description: id of the ressource
          type: string
        self:
          $ref: '#/components/schemas/Links'
        type:
          description: the resource name
          type: string
          example: location
        subType:
          description: location sub type
          type: string
          enum:
          - AIRPORT
          - CITY
          - POINT_OF_INTEREST
          - DISTRICT
          example: AIRPORT
        name:
          description: short name of the location
          type: string
          example: Paris CDG
        geoCode:
          $ref: '#/components/schemas/GeoCode'
        category:
          description: category of the location
          type: string
          enum:
          - SIGHTS
          - BEACH_PARK
          - HISTORICAL
          - NIGHTLIFE
          - RESTAURANT
          - SHOPPING
          example: HISTORICAL
        tags:
          description: list of tags related to the location
          type: array
          items:
            type: string
            example:
            - grocery
            - japanese
            - cafe
        rank:
          description: the rank is the position compared to other locations based on how famous is a place. 1 being the highest.
          type: string
          example: 1
    Error_500:
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - errors
      example:
        errors:
        - status: 500
          code: 141
          title: SYSTEM ERROR HAS OCCURRED
    Links:
      properties:
        href:
          type: string
          format: uri
        methods:
          type: array
          items:
            type: string
            enum:
            - GET
            - PUT
            - DELETE
            - POST
            - PATCH
      example:
        href: string
    GeoCode:
      properties:
        latitude:
          description: latitude of the location
          type: number
          format: double
          example: 43.580418
        longitude:
          description: longitude of the location
          type: number
          format: double
          example: 7.125102
  parameters:
    pageLimit:
      name: page[limit]
      description: maximum items in one page
      required: false
      in: query
      schema:
        type: integer
        default: 10
    pageOffset:
      name: page[offset]
      description: start index of the requested page
      required: false
      in: query
      schema:
        type: integer
        default: 0
    categories:
      name: categories
      description: "category of the location. \n\nMultiple value can be selected using a comma i.e. SIGHTS, SHOPPING\n"
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - SIGHTS
          - NIGHTLIFE
          - RESTAURANT
          - SHOPPING
          collectionFormat: csv
